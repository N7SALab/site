<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Firewall</title>
    <style>
        body {
            background-color: #000;
            color: #00FF00; /* Electric Green */
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hides scrollbars */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00FF00;
            animation: glitch 2s infinite;
        }

        p {
            font-size: 1.2em;
            max-width: 70%;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 0 0 5px #00FF00;
        }

        a {
            color: #00FF00;
            text-decoration: none;
            border: 1px solid #00FF00;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            display: inline-block; /* Makes it block-like for hover effects */
        }

        a:hover {
            background-color: #00FF00;
            color: #000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark transparent overlay */
            pointer-events: none; /* Allows clicking through */
            z-index: 1; /* Ensure it's above other elements */
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        /* Matrix-style background */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Behind everything */
            font-size: 12px;
            line-height: 1.2;
            white-space: pre; /* Preserves spaces for the matrix effect */
        }
    </style>
</head>
<body>

    <div id="matrix"></div>

    <div class="overlay"></div> <!-- Dark Transparent Overlay -->

    <div class="container">
        <h1>The Firewall</h1>
        <p>They watch. They listen. They collect.  But some doors are best left unopened.  Do you dare to cross the threshold? The answers you seek may come at a price.</p>
        <a href="#">Enter the System (Coming Soon)</a>
    </div>

    <script>
        // Matrix Background Effect
        const matrixElement = document.getElementById('matrix');
        const characters = '01'; // Binary characters
        const columns = Math.floor(window.innerWidth / 10);
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            let matrixString = "";
            for (let i = 0; i < drops.length; i++) {
                for (let j = 0; j < drops[i]; j++) {
                    matrixString += characters.charAt(Math.floor(Math.random() * characters.length));
                }
                matrixString += "\n"; // Start a new column

                if (Math.random() < 0.1) {
                    drops[i] = 1;
                }

                drops[i]++;

                if (drops[i] * 12 > window.innerHeight && Math.random() > 0.25) {
                   drops[i] = 0;
                }

            }

            matrixElement.textContent = matrixString;

        }

        setInterval(drawMatrix, 50); // Adjust speed here.  Smaller number = faster
    </script>
</body>
</html>
