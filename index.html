<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Echo Chamber</title>
    <style>
        body {
            background-color: #111; /* Dark background */
            color: #ddd; /* Light text */
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars */
            cursor: none; /* Hide cursor */
        }

        #container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        #message {
            font-size: 1.5em;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 3s forwards;
            transition: opacity 0.5s; /* Smooth transition on hover */
            cursor: pointer;
        }

        #message:hover {
            opacity: 1; /* Slightly brighter on hover */
        }

        #inputField {
            background-color: rgba(0, 0, 0, 0.3);
            border: none;
            color: #ddd;
            padding: 10px;
            font-size: 1em;
            border-bottom: 1px solid #777;
            outline: none;
            opacity: 0;
            animation: fadeIn 3s forwards;
        }

        #echo {
            font-size: 0.8em;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 3s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.7; }
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1000;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="message">Click... if you dare.</div>
        <input type="text" id="inputField" placeholder="Speak..." style="display:none;">
        <div id="echo" style="display:none;"></div>
    </div>

    <div class="cursor"></div>

    <script>
        const message = document.getElementById('message');
        const inputField = document.getElementById('inputField');
        const echoDiv = document.getElementById('echo');
        const cursor = document.querySelector('.cursor');

        message.addEventListener('click', () => {
            message.style.display = 'none';
            inputField.style.display = 'block';
            echoDiv.style.display = 'block';
            inputField.focus(); // Focus on the input field
        });

        inputField.addEventListener('input', () => {
            echoDiv.textContent = inputField.value;
        });

        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 10}px)`;
        });

        document.addEventListener('mousedown', () => {
            cursor.style.transform = 'scale(0.7) translate(-50%, -50%)';
            cursor.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
        });

        document.addEventListener('mouseup', () => {
            cursor.style.transform = 'scale(1) translate(-50%, -50%)';
            cursor.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
        });
    </script>

</body>
</html>
