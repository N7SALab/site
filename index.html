<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Whispering Void</title>
    <style>
        body {
            background-color: #111; /* Deep dark background */
            color: #ccc; /* Muted text color */
            font-family: monospace, sans-serif; /* Monospace font for a cryptic feel */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars */
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s forwards; /* Fade in on load */
        }

        h1 {
            font-size: 3em;
            font-weight: normal;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #000; /* Subtle shadow for depth */
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 30px;
            text-shadow: 0 0 3px #000;
        }

        #secret-button {
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent button */
            border: 1px solid #555;
            color: #ddd;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            text-shadow: 0 0 2px #000;
            outline: none; /* Remove default focus outline */
        }

        #secret-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Starry background effect */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { opacity: 0.2; }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Starry background generation
            const starsContainer = document.getElementById("stars");
            const numStars = 100;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement("div");
                star.classList.add("star");
                star.style.width = `${Math.random() * 3 + 1}px`; // Random size
                star.style.height = `${Math.random() * 3 + 1}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 5}s`; // Stagger animation
                starsContainer.appendChild(star);
            }


            // Secret button action (replace with your actual secret)
            const secretButton = document.getElementById("secret-button");
            secretButton.addEventListener("click", function() {
                alert("The answer... is 42."); // Replace with your actual secret
            });
        });
    </script>
</head>
<body>

    <div id="stars"></div>

    <div id="container">
        <h1>The Whispering Void</h1>
        <p>Deep within the digital ether, a secret lies dormant, waiting to be discovered. Can you unravel the enigma?</p>
        <button id="secret-button">Seek the Truth</button>
    </div>

</body>
</html>
